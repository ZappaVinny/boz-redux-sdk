# Hand-kept notes for docs/console-reference.md (generated by `symbols.py console-doc`).
# One table per console variable or command:
#
#   [cvar.UnlimitedHealth]
#   note = "what it does, units, valid values"
#   status = "works" | "partial" | "no effect" | "crashes" | "untested"   (from in-game testing)
#
#   [command.SetRound]
#   args = "<round>"
#   note = "..."
#
# Notes come from reverse engineering (the function that uses the value) or from testing.

[cvar.UnlimitedHealth]
status = "works"
note = "Player takes no damage."
[cvar.WeaponsUnlimitedAmmo]
status = "works"
note = "Firing takes no ammo (checked in the weapon's firing state)."
[cvar.UnlimitedStamina]
status = "works"
note = "Sprint never runs out."
[cvar.AIGodmode]
note = "Zombies and other AI cannot be hurt."
[cvar.UnlimitedScore]
status = "works"
note = "Purchases cost nothing: CScoreManager skips SUBJECT_CHARGE_POINTS and SUBJECT_POINTS_PENALTY. Registered with the description \"Unlimited points to buy stuff\"."
[cvar.StartingScore]
note = "Points each player starts a match with (read by CScoreManager::GetScore / AddScore when a player's score is created). Never registered by the game; register it first (Developer mod: cvar StartingScore 5000)."
status = "works"
[cvar.EnableSetFov]
note = "Turns on the SetFov override (CWeaponManager::UpdateFov)."
status = "works"
[cvar.SetFov]
note = "Field of view in degrees while EnableSetFov is on, clamped to at most the base FOV (the map's MainCamera m_fov, 50 on Kino): it can only narrow the view. Widen it by raising CWeaponManager +0xc4 (the Developer mod's FOV slider)."
status = "partial"
[cvar.AllWeapons]
note = "Developer cheat: gives every weapon, including ones from other maps whose animations are not loaded. Those have no ammo, cannot be switched away from, and equipping one crashed the game in CWeaponManager::SetWeapon (null animation state machine); the client now recovers from that fault."
status = "crashes"
[cvar.TurnSpeed]
note = "Horizontal look speed multiplier."
[cvar.PitchSpeed]
note = "Vertical look speed multiplier."
[cvar.zombieHeadshotBonus]
note = "Extra points for a headshot kill, by zombie type index (read in CAIControllerZombie::State_Dead)."
[cvar.musicEnabled]
note = "1 plays music, 0 mutes it."
[cvar.soundEnabled]
note = "1 plays sound effects, 0 mutes them."
[cvar.SaveOnPause]
note = "Saves the game when the pause menu opens."
[cvar.SaveOnSuspend]
note = "Saves the game when the app is suspended."
[cvar.HealthIgnoreBleedOutTime]
status = "works"
note = "Downed players never bleed out (read in CHealth::Update)."
[cvar.FreeFlySpeed]
status = "works"
note = "Speed of the developer fly mode (CPlayerFreeFly, registered as \"Flying!\"): distance per movement event at full stick, and per SUBJECT_PLAYER_ASCEND. Registered when the player spawns. The Developer mod's `noclip` toggles the mode."

[command.SetRound]
args = "<round>"
note = "Dead Ops Arcade: jumps to a round."
[command.StartWave]
status = "works"
note = "Zombies: starts the next round."
[command.SpawnZombie]
status = "works"
note = "Zombies: spawns one zombie."
[command.SpawnWaveZombie]
note = "Zombies: spawns a zombie that counts toward the current round."
[command.KillAllZombies]
note = "Zombies: kills every zombie."
status = "works"
[command.KillAllWaveZombies]
note = "Zombies: kills the zombies of the current round."
[command.TimeTogglePause]
status = "works"
note = "Pauses or resumes game time."
[command.TimeFactor]
args = "<factor>"
note = "Game speed multiplier (1 = normal)."
[command.wireframe]
status = "works"
note = "Toggles wireframe rendering."
[command.KillPlayer]
note = "Kills the local player."
[command.SwitchPowerOn]
status = "works"
note = "Turns the map's power on."
[command.toggleEnemySpawn]
note = "Dead Ops Arcade: zombie spawning on or off."
[command.spawnEnemy]
note = "Dead Ops Arcade: spawns an enemy."

[command.EnablePerk]
note = "No handler in the release build: does nothing. The Developer mod's `perks` command grants all perks through CPerkManager::GainPerk."
status = "no effect"
[command.ResetAllPerks]
note = "Removes the player's perks."
