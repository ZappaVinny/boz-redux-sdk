name: Release

# Builds the SDK packages: the Linux ZIP (source with the gamedef, the prebuilt editor and the
# navmesh helpers, tools/package_release.sh) and the Windows ZIP (the same folder with boz-sdk.exe,
# tools/build_exe.py). A v* tag publishes both as a GitHub release; a push to main keeps them as
# workflow artifacts.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  BLENDER_VERSION: 5.2.1

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="main-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-mingw-w64-x86-64 lua5.4 \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Test
        run: |
          python3 -m pip install -e .
          python3 -X warn_default_encoding -W error::EncodingWarning -m unittest discover tools/bozkit/tests
          lua5.4 lib/tests/run.lua
      - name: Build the navmesh helpers
        run: |
          cmake -S tools/navmesh -B tools/navmesh/build -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/navmesh/build -j
          cmake -S tools/navmesh -B tools/navmesh/build-windows -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build tools/navmesh/build-windows -j
          cp tools/navmesh/build-windows/boz-navmesh.exe tools/navmesh/build/
      - uses: actions/cache@v4
        with:
          path: .blender-ci
          key: blender-${{ env.BLENDER_VERSION }}
      - name: Get Blender
        run: |
          if [ ! -x .blender-ci/blender ]; then
            mkdir -p .blender-ci
            curl -fL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
              | tar -xJ --strip-components=1 -C .blender-ci
          fi
      - name: Build the editor
        run: python3 tools/build_suite.py --blender .blender-ci/blender --all-platforms
      - name: Package
        run: tools/package_release.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: BOZ-Redux-SDK-linux
          path: build/release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-folder
          path: build/release/BOZ-Redux-SDK-${{ steps.version.outputs.version }}
          retention-days: 1

  windows:
    needs: package
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      NAME: BOZ-Redux-SDK-${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build boz-sdk.exe
        run: |
          python -m pip install -e '.[desktop]' pyinstaller
          python tools/build_exe.py
      - uses: actions/download-artifact@v4
        with:
          name: sdk-folder
          path: build/release/${{ env.NAME }}
      - name: Package
        run: |
          cp -r build/exe/boz-sdk/. "build/release/$NAME/"
          python -c 'import shutil, sys; shutil.make_archive(sys.argv[1], "zip", sys.argv[2], sys.argv[3])' \
            "build/release/$NAME-windows" build/release "$NAME"
      - name: The exe finds the SDK's files
        run: '"build/release/$NAME/boz-sdk.exe" --check'
      - uses: actions/upload-artifact@v4
        with:
          name: BOZ-Redux-SDK-windows
          path: build/release/*-windows.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BOZ-Redux-SDK-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" --title "BOZ Redux SDK $GITHUB_REF_NAME" --generate-notes
